<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tamaemu - design states</title>
<link rel="icon" type="image/png" href="maragotchifavicon.png">
<link rel="stylesheet" href="theme.css">
<!--
  Development-only fixture harness. Cloned cards follow production markup;
  hand-written runtime rows and staged production messages can drift.
-->
<style>
  body { max-width: none; }
  .harness-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; gap: .5rem; align-items: center; flex-wrap: wrap;
    padding: .6rem .75rem; margin: -1.25rem -1.25rem 1.25rem;
    background: var(--card); border-bottom: 1px solid var(--line);
  }
  .harness-bar h1 { font-size: 13px; font-weight: 600; margin: 0 auto 0 0; }
  /* theme.css scopes .home to .topbar. */
  .harness-bar a { color: var(--faint); text-decoration: none; font-size: 13px; }
  .harness-bar a:hover { color: var(--ink); }
  /* Keep non-modal fixture dialogs in flow. */
  .state dialog { position: static; margin: 0; }
  .harness-grid {
    display: grid; gap: 1.25rem;
    grid-template-columns: repeat(auto-fill, minmax(var(--w, 420px), 1fr));
    align-items: start;
  }
  .state { display: flex; flex-direction: column; gap: .4rem; min-width: 0; }
  .state > .label {
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--faint); font-weight: 600;
  }
  .state > .note { font-size: 11.5px; color: var(--faint); margin: -.2rem 0 .1rem; }
  .state[data-hard="1"] > .label::after {
    content: " · hard to reach"; color: var(--warn); letter-spacing: 0;
    text-transform: none; font-weight: 400;
  }
</style>

<div class="harness-bar">
  <h1>tamaemu design states</h1>
  <button id="theme">Dark mode</button>
  <button id="width">Narrow (mobile)</button>
  <a class="home" href="index.html" style="margin-left:.5rem">open the real page &rarr;</a>
</div>

<div class="harness-grid" id="grid"></div>

<script type="module">
/* Clone production markup; DOMParser keeps its scripts inert. */
const src = new DOMParser().parseFromString(
    await (await fetch('./index.html')).text(), 'text/html');

/* Find cards by production IDs, not display copy. */
function card(sel) {
    for (const c of src.querySelectorAll('.card')) {
        if (!c.querySelector(sel)) continue;
        const clone = c.cloneNode(true);
        /* Render cloned popovers inline in this catalogue. */
        for (const p of clone.querySelectorAll('[popover]')) p.removeAttribute('popover');
        return clone;
    }
    throw new Error(`no card containing "${sel}" in index.html - was it removed?`);
}

/* Clone the standalone dialog and open it for the fixture. */
function dialog(sel) {
    const d = src.querySelector(sel);
    if (!d) throw new Error(`no ${sel} in index.html - was it removed?`);
    const clone = d.cloneNode(true);
    clone.setAttribute('open', '');
    return clone;
}

const grid = document.getElementById('grid');
const $ = (el, sel) => el.querySelector(sel);

function show(label, node, { note = '', hard = false } = {}) {
    const wrap = document.createElement('div');
    wrap.className = 'state';
    if (hard) wrap.dataset.hard = '1';
    const l = document.createElement('div'); l.className = 'label'; l.textContent = label;
    wrap.append(l);
    if (note) { const n = document.createElement('div'); n.className = 'note'; n.textContent = note; wrap.append(n); }
    wrap.append(node);
    grid.append(wrap);
}

/* Draw a fake frame; this harness never runs firmware. */
function paint(canvas) {
    const g = canvas.getContext('2d');
    const img = g.createImageData(128, 128);
    const put = (x, y, r, gr, b) => {
        const i = (y * 128 + x) * 4;
        img.data[i] = r; img.data[i+1] = gr; img.data[i+2] = b; img.data[i+3] = 255;
    };
    for (let y = 0; y < 128; y++) for (let x = 0; x < 128; x++) {
        const band = y < 26 || y > 101;
        if (band) put(x, y, 250, 226, 150);
        else if (y > 34 && y < 94 && x > 8 && x < 120) put(x, y, 255, 255, 255);
        else put(x, y, 168, 226, 236);
    }
    for (let y = 48; y < 60; y++) for (let x = 24; x < 104; x++)
        if ((x + y) % 7 < 4) put(x, y, 26, 35, 96);
    for (let y = 66; y < 78; y++) for (let x = 34; x < 94; x++)
        if ((x * y) % 5 < 3) put(x, y, 26, 35, 96);
    g.putImageData(img, 0, 0);
}

{
    const c = card('#device');
    show('Device - no firmware', c, { note: 'First run. The drop zone is the screen.' });
}
{
    const c = card('#device');
    /* Match setState()'s device-and-state pill. */
    $(c, '#statePill').textContent = 'Tamagotchi 4U · Ready';
    show('Device - ready', c, { note: 'A dump is picked but not started.' });
}
for (const [label, pill, cls, note] of [
    ['Device - running', 'Running', 'on', 'The bezel only goes black once there is a picture.'],
    ['Device - paused', 'Paused', '', 'Same picture, quiet pill.'],
    ['Device - CPU stopped', 'CPU stopped', 'bad', 'Almost always the wrong device for the dump.'],
]) {
    const c = card('#device');
    const dev = $(c, '#device');
    dev.dataset.empty = '0'; dev.dataset.live = pill === 'Running' ? '1' : '0';
    $(c, '#statePill').textContent = 'Tamagotchi 4U · ' + pill;
    $(c, '#statePill').className = 'pill' + (cls ? ' ' + cls : '');
    for (const b of c.querySelectorAll('.key')) b.disabled = false;
    grid.append(document.createComment(''));
    show(label, c, { note, hard: pill === 'CPU stopped' });
    paint($(c, '#screen'));
}
{
    const c = card('#device');
    const dev = $(c, '#device');
    dev.dataset.empty = '0'; dev.dataset.live = '1';
    $(c, '#statePill').textContent = 'Tamagotchi 4U · Running';
    $(c, '#statePill').className = 'pill on';
    for (const b of c.querySelectorAll('.key')) b.disabled = false;
    $(c, '#btnB').dataset.held = '1';
    show('Device - button held', c, { note: 'B pressed. The held key gets the filled primary style.' });
    paint($(c, '#screen'));
}

}

    $(c, '#status').textContent = '60 fps · 4 min in-game\nsaved 11:42:07';

}
{

}
{
    const c = card('#play');
    for (const b of ['#play','#exportLive','#speedUp','#speedDown']) if ($(c, b)) $(c, b).disabled = false;
    $(c, '#play').textContent = 'Pause';
    $(c, '#saveNow').title = $(c, '#reboot').title = 'This device has no slot behind it.';

}
{

}
{

            + 'device added later without one still shows the warning.', hard: true });
}

  </div>`;

    $(c, '#exportLive').disabled = false;

}
{
    const c = card('#slotList');
    /* FIXTURE: renderSlots() shows five rows before the reveal. */
    $(c, '#slotList').innerHTML =
        slotRow({ name: 'Kuchipatchi', device: "Tamagotchi P's", active: true,

      + slotRow({ name: 'TMGC+C_Hexagontchi1', device: 'Tamagotchi Plus Color (Hexagontchi)',

    $(c, '#quota').textContent = '212 MB used';

    $(c, '#exportLive').disabled = false;
    show('Save slots - capped, more hidden', c,

           hard: true });
}
{

    $(c, '#slotList').innerHTML =

    $(c, '#quota').textContent = '';

      + 'keep a copy you own. Private browsing and blocked site data are the '
      + 'usual causes (SecurityError).';
    show('Save slots - storage unavailable', c,
         { note: 'Export becomes the primary button. Requires blocking IndexedDB to see.',
           hard: true });
}
{

    $(c, '#slotList').innerHTML =
        slotRow({ name: 'Mametchi', device: "Tamagotchi P's", active: true,
                  primaryLabel: 'Reload', sub: 'in-game 6 h · saved 3 Aug 2026, 10:02' });
    $(c, '#quota').textContent = '4.9 GB used';
    $(c, '#persistNote').textContent = 'Storage is persistent, about 4.9 GB available.';
    $(c, '#exportLive').disabled = false;
    $(c, '#storageNote').hidden = false;

    $(c, '#storageNote').innerHTML =
        '<b>Out of storage space, so autosave has stopped</b> rather than failing '

    show('Save slots - quota exhausted', c,

}
{

    $(c, '#linkNote').textContent = 'Linked to another tamaemu window.';
    show('Save slots - linked', c,
         { note: 'Two windows, same device, both running.' });
}
{

    $(c, '#linkNote').hidden = false;
    $(c, '#linkNote').textContent =
        'The other device is paused - bring its window back on screen.';
    show('Save slots - peer paused', c, {

}
{

    $(c, '#linkNote').textContent =

}
{

        'That save is open in another tamaemu window - export it there and '
      + 'import a copy if you want two.';

        note: 'Refused before boot; nothing was overwritten. Latched here for '

        hard: true });
}

{

}

{

{

/* FIXTURE: device.js builds these rows at runtime. Keep this copy in step. */

/* Give each fixture chooser an independent radio group. */
let deviceRowGroup = 0;
function deviceRows(node, items, checked) {
    const list = $(node, '#deviceList');
    const group = `device-fixture-${deviceRowGroup++}`;
    list.replaceChildren();
    /* FIXTURE: Match device.js's row markup. */
    for (const [name, title, size, aka] of items) {
        const row = document.createElement('label');
        row.className = 'device-row';
        row.innerHTML = '<input type="radio">'
                      + '<span class="name"><span class="t"></span>'
                      + '<span class="aka"></span></span><span class="size"></span>';
        row.querySelector('input').name = group;
        row.querySelector('input').checked = name === checked;
        row.querySelector('.t').textContent = title;
        row.querySelector('.aka').textContent = aka ?? '';
        row.querySelector('.size').textContent = size;
        list.append(row);
    }
}

/* Match production theme storage and fallback behavior. */
const themeBtn = document.getElementById('theme');
const apply = t => {
    if (t !== 'dark') t = 'light';
    document.documentElement.dataset.theme = t;
    themeBtn.textContent = t === 'dark' ? 'Light mode' : 'Dark mode';
    localStorage.setItem('tamaemu.theme', t);
};
apply(localStorage.getItem('tamaemu.theme')
   ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
themeBtn.onclick = () =>
    apply(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');

const widthBtn = document.getElementById('width');
let narrow = false;
widthBtn.onclick = () => {
    narrow = !narrow;
    document.getElementById('grid').style.setProperty('--w', narrow ? '340px' : '420px');
    widthBtn.textContent = narrow ? 'Wide (desktop)' : 'Narrow (mobile)';
};
</script>
